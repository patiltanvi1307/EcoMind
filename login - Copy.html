<!DOCTYPE html>
<html>

<head>
    <title>EcoMind - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🔐 EcoMind Login</h1>

    <p>Welcome back! Continue your eco journey 🌱</p>

    <form method="POST" action="/login">

        <label>Username:</label>
        <br>

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <br><br>

        <label>Password:</label>
        <br>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <br><br>

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <br>

    <p>Don't have an account?</p>

    <a href="/register">
        <button>📝 Register</button>
    </a>

    <br><br>

    <a href="/">
        <button>🏠 Home</button>
    </a>

</body>

</html>

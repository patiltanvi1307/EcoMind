<!DOCTYPE html>
<html>

<head>
    <title>EcoMind - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🌱 Create Your EcoMind Account</h1>

    <p>Start your journey towards a greener lifestyle!</p>

    <form method="POST" action="/register">

        <label>Username:</label>
        <br>

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <br><br>

        <label>Password:</label>
        <br>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <br><br>

        <button type="submit">
            📝 Register
        </button>

    </form>

    <br>

    <p>Already have an account?</p>

    <a href="/login">
        <button>🔐 Login</button>
    </a>

    <br><br>

    <a href="/">
        <button>🏠 Home</button>
    </a>

</body>

</html>
